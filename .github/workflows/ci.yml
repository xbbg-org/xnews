name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-quality:
    name: Core quality and packaged install
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run core quality suite
        run: bun run quality:core

      - name: Smoke test core packaged install
        run: bun run smoke:packaged-install:core

  langgraph-quality:
    name: LangGraph companion quality
    needs: core-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Link the local core workspace into the companion
        run: bun install --cwd packages/xnews-langgraph --frozen-lockfile

      - name: Build local core first
        run: bun run build:core

      - name: Run companion quality suite against local core
        run: bun run --cwd packages/xnews-langgraph quality

  langgraph-package-smoke:
    name: LangGraph packaged install (Zod ${{ matrix.zod }})
    needs: langgraph-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zod: ["3.25.76", "4.2.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build local core first
        run: bun run build:core

      - name: Pack and install local core and companion
        run: >-
          bun run --cwd packages/xnews-langgraph smoke:packaged-install --
          "${{ matrix.zod }}"
